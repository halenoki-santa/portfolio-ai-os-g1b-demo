name: PoC demo - Python unit tests only
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout demo code without persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Python standard library unit tests
        run: python3 -m unittest discover -s tests -v
